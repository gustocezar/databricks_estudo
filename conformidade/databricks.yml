# Bundle da conformidade: o job diário da sonda (src/sonda_diaria.py), o mesmo que `gerar_conformidade.py registrar`.
# As visões e as regras de pos_venda.conformidade continuam sendo criadas pelo `aplicar` local.
#
#   databricks bundle validate --profile <perfil>
#   databricks bundle deploy -t dev --profile <perfil>
#   databricks bundle run sonda_conformidade -t dev --profile <perfil>
#
# Sem cluster declarado: roda no serverless.
bundle:
  name: pos_venda_conformidade

variables:
  sonda_status:
    description: "Agenda da sonda (06:45, depois da carga das 05:00 e do Studio das 06:30). PAUSED = desligada."
    default: UNPAUSED   # ligada desde 26/11/2026, a pedido do dono, junto com as outras agendas (P02)

resources:
  jobs:
    sonda_conformidade:
      name: pos_venda_conformidade_sonda
      description: >-
        Sonda diária da conformidade: testa cada view do workspace com DESCRIBE QUERY (regra USO03) e grava a foto do
        dia de boas_praticas_dados em pos_venda.conformidade.historico (P35, P37).
      tags:
        dominio: pos_venda
        abordagem: conformidade
        project: pos_venda        # tags de custo da FinOps (PLT01, P31)
        team: squad-pos-venda
      performance_target: STANDARD
      max_concurrent_runs: 1
      timeout_seconds: 1200    # 20 min: piso para job sem linha de base; a sonda leva poucos minutos (PLT03, P40)
      schedule:
        quartz_cron_expression: "0 45 6 * * ?"   # todo dia às 06:45
        timezone_id: America/Sao_Paulo
        pause_status: ${var.sonda_status}
      tasks:
        - task_key: sonda
          notebook_task:
            notebook_path: ./src/sonda_diaria.py

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-15c48c79-7aa2.cloud.databricks.com
