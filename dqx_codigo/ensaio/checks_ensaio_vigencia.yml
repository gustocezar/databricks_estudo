- name: periodicidade_fora_do_dominio
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: coalesce(periodicidade_pagamento IN ('MENSAL', 'QUINZENAL', 'TRIMESTRAL', 'SEMESTRAL', 'ANUAL'),
        true)
      msg: 'periodicidade fora do domínio (ex.: BIMESTRAL)'
  filter: data_extracao >= DATE'2027-01-05'
