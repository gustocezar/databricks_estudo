resources:
  jobs:
    carga_setup:
      name: pos_venda_carga_setup
      description: "Rodar uma vez: cria os schemas fonte/bronze/silver/gold e o cadastro de apolices do sistema de origem simulado."
      tags:
        dominio: pos_venda
        aidevkit_project: ai-dev-kit
      performance_target: STANDARD
      max_concurrent_runs: 1
      timeout_seconds: 1800    # 30 min: piso para job sem linha de base (execução única) (PLT03, P40)
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../src/notebooks/00_setup.py
