resources:
  jobs:
    medalhao_sql:
      name: pos_venda_medalhao_sql
      description: "Medalhao pos_venda com notebooks SQL (bronze > silver > gold/star schema). Recria as tabelas *_sql a cada execucao."
      tags:
        dominio: pos_venda
        abordagem: notebook_sql
        aidevkit_project: ai-dev-kit
      performance_target: STANDARD   # batch diario, sem prazo critico
      max_concurrent_runs: 1
      timeout_seconds: 1800    # 30 min: piso (sugerido pela sustentação: 11 min) (PLT03, P40)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # todo dia as 06:00
        timezone_id: America/Sao_Paulo
        pause_status: ${var.sql_schedule_status}
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks_sql/01_bronze_sql.sql
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks_sql/02_silver_sql.sql
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/notebooks_sql/03_gold_sql.sql
